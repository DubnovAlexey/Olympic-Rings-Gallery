<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Olympic Rings Gallery — an art page where every ring plays its own track: the Olympic emblem, rings drifting in depth and a medal carousel.">
    <meta name="theme-color" content="#060b18">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/zoich.png" type="image/png">
    <title>Olympic Rings Gallery</title>
</head>
<body>
<!-- Фон в несколько слоёв: ночное небо, медленное сияние, лучи прожекторов -->
<div class="sky" aria-hidden="true">
    <div class="sky-aurora"></div>
    <div class="sky-beams"></div>
    <div class="sky-glow"></div>
</div>
<div class="flying-rings-container"></div>

<main class="container">
    <div class="zoich-wrapper">
        <img src="img/zoich.png" id="zoich" alt="Zoich, the mascot: play or stop the music" class="zoich" width="255" height="270">
        <div class="tooltip" aria-hidden="true"><i>Click</i></div>
    </div>
    <audio id="my-audio"></audio>

    <div class="rings-wrapper">
        <!-- Порядок важен: по нему кольца привязаны к трекам 1–5 и сплетаются друг с другом -->
        <div class="ring tube blue"></div>
        <div class="ring tube black"></div>
        <div class="ring tube yellow"></div>
        <div class="ring tube red"></div>
        <div class="ring tube green"></div>
    </div>

    <section class="medal-carousel" aria-label="Medal rings: five more tracks">
        <button class="carousel-btn prev" type="button" aria-label="Previous ring">‹</button>
        <div class="carousel-stage">
            <div class="carousel-track" id="medalTrack"></div>
        </div>
        <button class="carousel-btn next" type="button" aria-label="Next ring">›</button>
        <p class="carousel-caption" id="medalCaption" aria-live="polite"></p>
    </section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
